<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Verwaltung · SchreibmaschineUltra</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&family=Special+Elite&display=swap" rel="stylesheet">
<style>
/* VOICE: ruhig und übersichtlich, ein Schreibtisch für den Besitzer
   IDEA: das Kontobuch neben der Schreibmaschine – eine Karteikarte pro Freund
   PICTURE: Kopf mit Walze wie auf der Hauptseite, darunter Zählerleiste und Kartei
   COLOUR and TYPE: Emaille-Grün, Farbbandrot, Papierweiß; Special Elite für Namen, Figtree für alles andere
   LAYOUT: Kopf, Zähler, Neuer Freund, Kartei; eine Spalte, max. 900px */
:root{color-scheme:light dark;--enamel:#1d4d45;--enamel-2:#163b35;--ribbon:#c8232c;--ribbon-dk:#9e1a22;
  --bg:light-dark(#eef2ef,#0f1f1c);--card:light-dark(#ffffff,#17302b);--ink:light-dark(#1a1c1f,#e8efe9);--mute:light-dark(#56635f,#a9bab4);--line:light-dark(#d5ddd9,#2c4842)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Figtree,system-ui,sans-serif;overflow-x:clip}
.wrap{max-width:900px;margin:0 auto;padding:0 max(4vw,16px)}
header{background:radial-gradient(120% 90% at 50% 0%,#2a6a5f 0%,var(--enamel) 55%,var(--enamel-2) 100%);color:#fff;padding:22px 0 26px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{margin:0;font:400 clamp(26px,5vw,38px)/1.1 "Special Elite",ui-serif,serif}
header a{color:#fff;font-weight:700;text-decoration:none;border:1.5px solid rgba(255,255,255,.5);border-radius:10px;padding:10px 14px;min-height:44px;display:inline-flex;align-items:center}
header a:hover{background:rgba(255,255,255,.1)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:20px}
@media(max-width:560px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:rgba(255,255,255,.1);border-radius:12px;padding:12px 14px}
.stat b{display:block;font:400 30px/1 "Special Elite",ui-serif,serif}
.stat span{font-size:13px;opacity:.85}
main{padding:28px 0 60px}
h2{font:400 24px/1.2 "Special Elite",ui-serif,serif;margin:0 0 10px}
section+section{margin-top:34px}
.add{display:flex;flex-wrap:wrap;gap:8px}
.add input{flex:1 1 240px;min-height:46px;font:16px Figtree,system-ui,sans-serif;padding:0 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
button{font:600 15px Figtree,system-ui,sans-serif;min-height:44px;padding:0 16px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button.pri{background:var(--ribbon);border-color:var(--ribbon);color:#fff}
button.pri:hover{background:var(--ribbon-dk)}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible{outline:3px solid var(--ribbon);outline-offset:2px}
.msg{min-height:1.5em;margin:10px 0 0;font-size:14px;color:var(--mute)}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.filters button{min-height:36px;padding:0 12px;font-size:14px;border-radius:999px}
.filters button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.list{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 16px;align-items:center}
@media(max-width:620px){.card{grid-template-columns:minmax(0,1fr)}}
.name{font:400 22px/1.2 "Special Elite",ui-serif,serif;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.meta{color:var(--mute);font-size:13px;margin-top:2px}
.badge{font:700 12px Figtree,system-ui,sans-serif;padding:2px 9px;border-radius:999px}
.badge.offen{background:#fff3c4;color:#6b5200}.badge.aktiv{background:#d8efe4;color:#1d4d45}.badge.gesperrt{background:#f7d4d6;color:#9e1a22}
.acts{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
@media(max-width:620px){.acts{justify-content:flex-start}}
.acts button{min-height:40px;padding:0 12px;font-size:14px}
.url{grid-column:1/-1;width:100%;min-height:40px;font:14px Figtree,system-ui,sans-serif;padding:0 10px;border-radius:8px;border:1.5px dashed var(--line);background:var(--bg);color:var(--ink)}
.empty{background:var(--card);border:1.5px dashed var(--line);border-radius:12px;padding:22px;text-align:center;color:var(--mute)}
</style></head><body>
<header><div class="wrap">
<div class="top"><h1>Verwaltung</h1><a href="/">Zur Schreibmaschine</a></div>
<div class="stats" aria-live="polite">
<div class="stat"><b id="sAktiv">–</b><span>aktiv</span></div>
<div class="stat"><b id="sOffen">–</b><span>noch nicht geöffnet</span></div>
<div class="stat"><b id="sGesperrt">–</b><span>gesperrt</span></div>
<div class="stat"><b id="sFrei">–</b><span>Plätze frei</span></div>
</div>
</div></header>
<main class="wrap">
<section>
<h2>Neuer Freund</h2>
<form id="add" class="add"><input id="name" maxlength="40" autocomplete="off" placeholder="Name, z. B. Lena" aria-label="Name des Freundes"><button class="pri" type="submit">Link erstellen</button></form>
<p class="msg" id="msg" role="status"></p>
</section>
<section>
<h2>Freunde</h2>
<div class="filters" id="filters">
<button type="button" data-f="alle" aria-pressed="true">Alle</button>
<button type="button" data-f="aktiv" aria-pressed="false">Aktiv</button>
<button type="button" data-f="offen" aria-pressed="false">Offen</button>
<button type="button" data-f="gesperrt" aria-pressed="false">Gesperrt</button>
</div>
<ul class="list" id="list"><li class="empty">Liste wird geladen …</li></ul>
</section>
</main>
<script>
{
const $=s=>document.querySelector(s);
const ESC=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const day=iso=>iso?new Date(iso).toLocaleDateString('de-DE',{day:'numeric',month:'short',year:'numeric'}):'';
let DATA=null,filter='alle';
const msg=t=>{$('#msg').textContent=t};
async function api(body){
  const r=await fetch('/api/links',body?{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body),cache:'no-store'}:{cache:'no-store'});
  const j=await r.json().catch(()=>null);
  if(j&&j.links)DATA=j;
  if(!r.ok)throw Object.assign(new Error('api'),{code:j&&j.error,status:r.status});
  return j;
}
function render(){
  if(!DATA)return;
  const n=s=>DATA.links.filter(l=>l.status===s).length;
  $('#sAktiv').textContent=n('aktiv');$('#sOffen').textContent=n('offen');$('#sGesperrt').textContent=n('gesperrt');
  $('#sFrei').textContent=Math.max(0,DATA.max-DATA.links.length);
  const full=DATA.links.length>=DATA.max;
  $('#name').disabled=full;$('#add button').disabled=full;
  $('#name').placeholder=full?`Alle ${DATA.max} Plätze vergeben. Lösche einen Link, um Platz zu machen.`:'Name, z. B. Lena';
  const ul=$('#list');ul.innerHTML='';
  const items=DATA.links.filter(l=>filter==='alle'||l.status===filter);
  if(!items.length){ul.innerHTML=`<li class="empty">${DATA.links.length?'Keine Freunde in dieser Ansicht.':'Noch keine Freunde. Erstelle oben den ersten Link.'}</li>`;return}
  for(const l of items){
    const li=document.createElement('li');li.className='card';
    li.innerHTML=`<div><div class="name">${ESC(l.name)}<span class="badge ${l.status}">${l.status}</span></div>
      <div class="meta">Erstellt ${day(l.created)}${l.activated?' · aktiviert '+day(l.activated):''}</div></div><div class="acts"></div>`;
    const acts=li.querySelector('.acts');
    const btn=(label,fn,cls)=>{const b=document.createElement('button');b.type='button';b.textContent=label;if(cls)b.className=cls;b.onclick=()=>fn(b);acts.appendChild(b)};
    if(l.status==='offen')btn('Link kopieren',async()=>{
      try{await navigator.clipboard.writeText(l.url);msg(`Link für ${l.name} kopiert. Schick ihn per Nachricht.`)}
      catch(e){let i=li.querySelector('.url');if(!i){i=document.createElement('input');i.className='url';i.readOnly=true;i.value=l.url;li.appendChild(i)}i.focus();i.select();msg('Kopieren nicht erlaubt: Der Link ist markiert, kopiere ihn von Hand.')}
    },'pri');
    if(l.status==='aktiv')btn('Gerät zurücksetzen',()=>act({action:'reset',token:l.token},`${l.name}: Gerät zurückgesetzt. Der Link funktioniert jetzt auf dem nächsten Gerät, das ihn öffnet.`));
    if(l.status==='gesperrt')btn('Entsperren',()=>act({action:'unblock',token:l.token},`${l.name} ist entsperrt.`));
    else btn('Sperren',()=>act({action:'block',token:l.token},`${l.name} ist gesperrt.`));
    let armed=0;btn('Löschen',b=>{if(!armed){armed=1;b.textContent='Wirklich löschen?';setTimeout(()=>{armed=0;b.textContent='Löschen'},3500);return}
      act({action:'delete',token:l.token},`Link von ${l.name} gelöscht.`)});
    ul.appendChild(li);
  }
}
async function act(body,ok){
  try{await api(body);render();msg(ok)}
  catch(e){msg(e.code==='max'?`Es sind schon alle ${DATA.max} Plätze vergeben.`:e.status===403?'Keine Berechtigung. Öffne die Verwaltung über deinen Besitzer-Link.':'Das hat nicht geklappt. Lade die Seite neu und versuche es noch einmal.')}
}
$('#add').addEventListener('submit',async e=>{e.preventDefault();
  const name=$('#name').value.trim();if(!name){msg('Gib zuerst einen Namen ein.');$('#name').focus();return}
  await act({action:'create',name},`Link für ${name} erstellt. Tippe bei ${name} auf „Link kopieren“.`);$('#name').value=''});
$('#filters').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;filter=b.dataset.f;
  for(const x of $('#filters').children)x.setAttribute('aria-pressed',x===b);render()});
api().then(render).catch(()=>{$('#list').innerHTML='<li class="empty">Die Liste konnte nicht geladen werden. Lade die Seite neu.</li>'});
}
</script>
</body></html>
