<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Verwaltung · SchreibmaschineUltra</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Special+Elite&display=swap" rel="stylesheet">
<style>
/* VOICE: sachlich und aufgeräumt, ein Register wie im Büro
   IDEA: das Ausleihbuch einer Schreibstube – jede Zeile ein Freund mit Stempel, Datum und Herkunft
   PICTURE: grüne Kopfleiste, Kennzahlen-Reihe mit Belegungsbalken, darunter das Register als Tabelle
   COLOUR and TYPE: Emaille-Grün, Farbbandrot für Aktionen, Papierweiß; Special Elite nur für Namen und Titel, Figtree für Daten
   LAYOUT: Kopfleiste, Titel mit Stand, Kennzahlen, Werkzeugleiste, Tabelle; unter 760px Zeilen als Karten */
:root{color-scheme:light dark;--enamel:#1d4d45;--enamel-2:#163b35;--ribbon:#c8232c;--ribbon-dk:#9e1a22;
  --bg:light-dark(#f1f4f2,#0f1f1c);--card:light-dark(#ffffff,#17302b);--ink:light-dark(#1a1c1f,#e8efe9);--mute:light-dark(#5d6a66,#a9bab4);
  --line:light-dark(#dde4e0,#2c4842);--head:light-dark(#f7f9f8,#1b3731);
  --ok:#2e8a62;--warn:#c99400;--bad:#c8232c;--free:light-dark(#b9c3bf,#4a625c)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Figtree,system-ui,sans-serif;overflow-x:clip;font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding:0 max(4vw,16px)}
.bar{background:linear-gradient(var(--enamel),var(--enamel-2));color:#fff}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:60px}
.brand{font:400 20px/1 "Special Elite",ui-serif,serif;display:flex;align-items:center;gap:10px}
.brand small{font:600 12px Figtree,system-ui,sans-serif;background:rgba(255,255,255,.14);padding:3px 9px;border-radius:999px}
.bar a{color:#fff;font-weight:600;text-decoration:none;border:1.5px solid rgba(255,255,255,.45);border-radius:9px;padding:8px 13px;min-height:40px;display:inline-flex;align-items:center}
.bar a:hover{background:rgba(255,255,255,.1)}
.bar .short{display:none}
@media(max-width:520px){.bar .long{display:none}.bar .short{display:inline}.brand{font-size:17px}}
main{padding:28px 0 56px}
.title{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
h1{margin:0;font:400 clamp(28px,4vw,40px)/1.1 "Special Elite",ui-serif,serif}
.stand{color:var(--mute);font-size:13px;display:flex;align-items:center;gap:10px}
button{font:600 14px Figtree,system-ui,sans-serif;min-height:40px;padding:0 14px;border-radius:9px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;white-space:nowrap}
button:hover{border-color:var(--mute)}
button.pri{background:var(--ribbon);border-color:var(--ribbon);color:#fff}
button.pri:hover{background:var(--ribbon-dk)}
button.danger{color:var(--bad)}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--ribbon);outline-offset:2px}

/* Kennzahlen */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media(max-width:720px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi b{display:block;font:600 32px/1.1 Figtree,system-ui,sans-serif}
.kpi span{display:flex;align-items:center;gap:7px;color:var(--mute);font-size:13px}
.kpi i{width:9px;height:9px;border-radius:50%;flex:none}
.cap{margin-top:12px;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 16px}
.cap .lab{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);margin-bottom:8px}
.cap .lab b{color:var(--ink)}
.meter{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--free)}
.meter i{display:block;height:100%}

/* Werkzeugleiste */
.panel{margin-top:22px;background:var(--card);border:1.5px solid var(--line);border-radius:14px;overflow:hidden}
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:14px 16px;border-bottom:1.5px solid var(--line)}
.search{flex:1 1 220px;min-height:40px;font:15px Figtree,system-ui,sans-serif;padding:0 12px;border-radius:9px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.seg{display:flex;border:1.5px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;border-radius:0;min-height:37px;background:transparent}
.seg button+button{border-left:1.5px solid var(--line)}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.addrow{display:flex;flex-wrap:wrap;gap:8px;padding:14px 16px;background:var(--head);border-bottom:1.5px solid var(--line)}
.addrow[hidden]{display:none}
.addrow input{flex:1 1 240px;min-height:40px;font:15px Figtree,system-ui,sans-serif;padding:0 12px;border-radius:9px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.msg{margin:0;padding:10px 16px;font-size:14px;background:light-dark(#eef7f2,#173a2f);border-bottom:1.5px solid var(--line)}
.msg:empty{display:none}

/* Register */
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;font-weight:700;color:var(--mute);background:var(--head);padding:10px 16px;border-bottom:1.5px solid var(--line);white-space:nowrap}
td{padding:12px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
.nm{font:400 19px/1.2 "Special Elite",ui-serif,serif}
.sub{display:block;color:var(--mute);font-size:12px;margin-top:2px}
.badge{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:12px;padding:3px 10px;border-radius:999px;white-space:nowrap}
.badge i{width:7px;height:7px;border-radius:50%}
.badge.aktiv{background:light-dark(#dff1e8,#1d4a3a);color:light-dark(#1d6146,#b9ecd3)}.badge.aktiv i{background:var(--ok)}
.badge.offen{background:light-dark(#fff3c9,#4a3e12);color:light-dark(#6b5200,#f3df9a)}.badge.offen i{background:var(--warn)}
.badge.gesperrt{background:light-dark(#fadbdd,#4d1d21);color:light-dark(#9e1a22,#f4b9be)}.badge.gesperrt i{background:var(--bad)}
.none{color:var(--mute)}
.acts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:nowrap}
.acts button{min-height:36px;padding:0 11px;font-size:13px}
.url{width:100%;margin-top:8px;min-height:36px;font:13px Figtree,system-ui,sans-serif;padding:0 10px;border-radius:8px;border:1.5px dashed var(--line);background:var(--bg);color:var(--ink)}
.empty td{text-align:center;color:var(--mute);padding:34px 16px}
@media(max-width:760px){
  thead{display:none}
  tr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:14px 16px;border-bottom:1px solid var(--line)}
  tr:last-child{border-bottom:0}
  td{display:block;padding:0;border:0}
  td.c-name{grid-column:1}td.c-status{grid-column:2;grid-row:1;align-self:start}
  td.c-cr,td.c-ac{grid-column:1/-1;font-size:14px}
  td.c-cr::before,td.c-ac::before{content:attr(data-l) ": ";color:var(--mute)}
  td.c-acts{grid-column:1/-1;margin-top:8px}
  .acts{justify-content:flex-start;flex-wrap:wrap}
  .empty{display:block}
}
.note{color:var(--mute);font-size:13px;margin:16px 2px 0;max-width:75ch}
</style></head><body>
<div class="bar"><div class="wrap">
<div class="brand">SchreibmaschineUltra <small>Verwaltung</small></div>
<a href="/"><span class="long">Zur Schreibmaschine</span><span class="short">Zurück</span></a>
</div></div>
<main class="wrap">
<div class="title">
<h1>Freunde &amp; Zugänge</h1>
<div class="stand"><span id="stand">Wird geladen …</span><button type="button" id="reload">Aktualisieren</button></div>
</div>

<div class="kpis">
<div class="kpi"><b id="kAktiv">–</b><span><i style="background:var(--ok)"></i>aktiv</span></div>
<div class="kpi"><b id="kOffen">–</b><span><i style="background:var(--warn)"></i>noch nicht geöffnet</span></div>
<div class="kpi"><b id="kGesperrt">–</b><span><i style="background:var(--bad)"></i>gesperrt</span></div>
<div class="kpi"><b id="kFrei">–</b><span><i style="background:var(--free)"></i>Plätze frei</span></div>
</div>
<div class="cap"><div class="lab"><span>Belegung</span><span><b id="capUsed">–</b> von <b id="capMax">–</b> Links vergeben</span></div>
<div class="meter" id="meter" role="img" aria-label="Belegung der Links"></div></div>

<div class="panel">
<div class="tools">
<input class="search" id="q" type="search" placeholder="Suchen nach Name" aria-label="Suchen">
<div class="seg" id="filters" role="group" aria-label="Filter">
<button type="button" data-f="alle" aria-pressed="true">Alle</button>
<button type="button" data-f="aktiv" aria-pressed="false">Aktiv</button>
<button type="button" data-f="offen" aria-pressed="false">Offen</button>
<button type="button" data-f="gesperrt" aria-pressed="false">Gesperrt</button>
</div>
<button type="button" class="pri" id="newBtn">+ Neuer Freund</button>
</div>
<form class="addrow" id="add" hidden><input id="name" maxlength="40" autocomplete="off" placeholder="Name, z. B. Lena" aria-label="Name des Freundes"><button class="pri" type="submit">Link erstellen</button><button type="button" id="addCancel">Abbrechen</button></form>
<p class="msg" id="msg" role="status"></p>
<table>
<thead><tr><th>Name</th><th>Status</th><th>Erstellt</th><th>Aktiviert</th><th><span class="sr" style="position:absolute;left:-9999px">Aktionen</span></th></tr></thead>
<tbody id="rows"><tr class="empty"><td colspan="5">Register wird geladen …</td></tr></tbody>
</table>
</div>
</main>
<script>
{
const $=s=>document.querySelector(s);
const ESC=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtFull=iso=>new Date(iso).toLocaleString('de-DE',{weekday:'short',day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
const fmtDay=iso=>new Date(iso).toLocaleDateString('de-DE',{day:'numeric',month:'short',year:'numeric'});
let DATA=null,filter='alle',q='',loadedAt=null;
const msg=t=>{$('#msg').textContent=t};
async function api(body){
  const r=await fetch('/api/links',body?{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body),cache:'no-store'}:{cache:'no-store'});
  const j=await r.json().catch(()=>null);
  if(j&&j.links){DATA=j;loadedAt=new Date()}
  if(!r.ok)throw Object.assign(new Error('api'),{code:j&&j.error,status:r.status});
  return j;
}
function kpis(){
  const n=s=>DATA.links.filter(l=>l.status===s).length,a=n('aktiv'),o=n('offen'),g=n('gesperrt');
  $('#kAktiv').textContent=a;$('#kOffen').textContent=o;$('#kGesperrt').textContent=g;$('#kFrei').textContent=Math.max(0,DATA.max-DATA.links.length);
  $('#capUsed').textContent=DATA.links.length;$('#capMax').textContent=DATA.max;
  const pct=x=>(x/DATA.max*100)+'%';
  $('#meter').innerHTML=`<i style="width:${pct(a)};background:var(--ok)"></i><i style="width:${pct(o)};background:var(--warn)"></i><i style="width:${pct(g)};background:var(--bad)"></i>`;
  $('#meter').setAttribute('aria-label',`${a} aktiv, ${o} offen, ${g} gesperrt, ${DATA.max-DATA.links.length} frei`);
  $('#stand').textContent='Stand: '+loadedAt.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})+' Uhr';
  const full=DATA.links.length>=DATA.max;$('#newBtn').disabled=full;$('#newBtn').title=full?`Alle ${DATA.max} Plätze vergeben`:'';
  if(full)$('#add').hidden=true;
}
function render(){
  if(!DATA)return;
  kpis();
  const tb=$('#rows');tb.innerHTML='';
  const ql=q.toLowerCase();
  const items=DATA.links.filter(l=>(filter==='alle'||l.status===filter)&&(!ql||l.name.toLowerCase().includes(ql)));
  if(!items.length){tb.innerHTML=`<tr class="empty"><td colspan="5">${DATA.links.length?'Keine Einträge für diese Auswahl.':'Noch keine Freunde. Tippe auf „+ Neuer Freund“.'}</td></tr>`;return}
  for(const l of items){
    const tr=document.createElement('tr');
    tr.innerHTML=`<td class="c-name"><span class="nm">${ESC(l.name)}</span></td>
      <td class="c-status"><span class="badge ${l.status}"><i></i>${l.status}</span></td>
      <td class="c-cr" data-l="Erstellt">${fmtDay(l.created)}</td>
      <td class="c-ac" data-l="Aktiviert">${l.activated?`<span title="${ESC(fmtFull(l.activated))}">${fmtDay(l.activated)}</span>`:'<span class="none">noch nicht</span>'}</td>
      <td class="c-acts"><div class="acts"></div></td>`;
    const acts=tr.querySelector('.acts');
    const btn=(label,fn,cls)=>{const b=document.createElement('button');b.type='button';b.textContent=label;if(cls)b.className=cls;b.onclick=()=>fn(b);acts.appendChild(b)};
    if(l.status==='offen')btn('Link kopieren',async()=>{
      try{await navigator.clipboard.writeText(l.url);msg(`Link für ${l.name} kopiert. Schick ihn per Nachricht.`)}
      catch(e){const td=tr.querySelector('.c-name');let i=td.querySelector('.url');if(!i){i=document.createElement('input');i.className='url';i.readOnly=true;i.value=l.url;td.appendChild(i)}i.focus();i.select();msg('Kopieren nicht erlaubt: Der Link ist markiert, kopiere ihn von Hand.')}
    },'pri');
    if(l.status==='aktiv')btn('Gerät zurücksetzen',()=>act({action:'reset',token:l.token},`${l.name}: Gerät zurückgesetzt. Der Link funktioniert jetzt auf dem nächsten Gerät, das ihn öffnet.`));
    if(l.status==='gesperrt')btn('Entsperren',()=>act({action:'unblock',token:l.token},`${l.name} ist entsperrt.`));
    else btn('Sperren',()=>act({action:'block',token:l.token},`${l.name} ist gesperrt.`));
    let armed=0;btn('Löschen',b=>{if(!armed){armed=1;b.textContent='Wirklich löschen?';setTimeout(()=>{armed=0;b.textContent='Löschen'},3500);return}
      act({action:'delete',token:l.token},`Link von ${l.name} gelöscht.`)},'danger');
    tb.appendChild(tr);
  }
}
async function act(body,ok){
  try{await api(body);render();msg(ok)}
  catch(e){msg(e.code==='max'?`Es sind schon alle ${DATA.max} Plätze vergeben.`:e.status===403?'Keine Berechtigung. Öffne die Verwaltung über deinen Besitzer-Link.':'Das hat nicht geklappt. Lade die Seite neu und versuche es noch einmal.')}
}
$('#newBtn').onclick=()=>{$('#add').hidden=false;$('#name').focus()};
$('#addCancel').onclick=()=>{$('#add').hidden=true;$('#name').value=''};
$('#add').addEventListener('submit',async e=>{e.preventDefault();
  const name=$('#name').value.trim();if(!name){msg('Gib zuerst einen Namen ein.');$('#name').focus();return}
  await act({action:'create',name},`Link für ${name} erstellt. Tippe in seiner Zeile auf „Link kopieren“.`);$('#name').value='';$('#add').hidden=true});
$('#filters').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;filter=b.dataset.f;
  for(const x of $('#filters').children)x.setAttribute('aria-pressed',x===b);render()});
$('#q').addEventListener('input',e=>{q=e.target.value.trim();render()});
const load=()=>api().then(()=>{render()}).catch(e=>{$('#rows').innerHTML=`<tr class="empty"><td colspan="5">${e.status===403?'Keine Berechtigung. Öffne die Verwaltung über deinen Besitzer-Link.':'Das Register konnte nicht geladen werden. Lade die Seite neu.'}</td></tr>`;$('#stand').textContent=''});
$('#reload').onclick=()=>{msg('');load()};
load();
setInterval(()=>{if(!document.hidden)load()},60000);
}
</script>
</body></html>
