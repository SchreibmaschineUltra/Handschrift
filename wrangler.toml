# Cloudflare Worker "handschrift": Zugangsschutz + Seite aus public/
name = "handschrift"
main = "src/worker.js"
compatibility_date = "2026-11-01"
# Nur die Hauptadresse, keine Vorschau-Adressen
workers_dev = true
preview_urls = false

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# Speicher für die persönlichen Links
[[kv_namespaces]]
binding = "DB"
id = "acbef1b612c1417eb8ca07e222b76936"

# Der geheime Besitzer-Schlüssel OWNER_TOKEN wird NICHT hier eingetragen,
# sondern im Cloudflare-Dashboard: Worker → Settings → Variables and Secrets.
